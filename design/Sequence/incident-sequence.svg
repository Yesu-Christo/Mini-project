<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title"><title id="title">CampusShield AI incident submission sequence</title><rect width="1200" height="650" fill="#07130d"/><text x="55" y="55" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="32" font-weight="700">Incident submission sequence</text><g font-family="Arial,sans-serif" font-size="17" fill="#f1f5f9" text-anchor="middle"><g fill="#102a1d" stroke="#006b3f" stroke-width="2"><rect x="75" y="100" width="170" height="50" rx="8"/><rect x="350" y="100" width="170" height="50" rx="8"/><rect x="625" y="100" width="170" height="50" rx="8"/><rect x="900" y="100" width="170" height="50" rx="8"/></g><text x="160" y="132">User</text><text x="435" y="132">React UI</text><text x="710" y="132">Django API</text><text x="985" y="132">Database</text><g stroke="#6a927d" stroke-width="2" stroke-dasharray="7 7"><path d="M160 150V570"/><path d="M435 150V570"/><path d="M710 150V570"/><path d="M985 150V570"/></g><g stroke="#70b7ff" stroke-width="3" fill="none"><path d="M160 205H435"/><path d="M435 275H710"/><path d="M710 345H985"/><path d="M985 415H710"/><path d="M710 485H435"/><path d="M435 555H160"/></g><g text-anchor="start" fill="#8fb8a0"><text x="190" y="195">1. Complete form</text><text x="465" y="265">2. POST /api/incidents/</text><text x="740" y="335">3. Validate and authenticate</text><text x="745" y="405">4. Create Incident INC####</text><text x="465" y="475">5. Return JSON success</text><text x="190" y="545">6. Show confirmation</text></g></g></svg>