<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title"><title id="title">CampusShield AI incident reporting activity flow</title><rect width="1200" height="500" fill="#07130d"/><text x="55" y="60" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="32" font-weight="700">Incident reporting flow</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#102a1d" stroke="#006b3f" stroke-width="3"><rect x="55" y="205" width="145" height="70" rx="35"/><rect x="260" y="190" width="165" height="100" rx="12"/><rect x="485" y="190" width="165" height="100" rx="12"/><rect x="710" y="190" width="165" height="100" rx="12"/><rect x="935" y="190" width="180" height="100" rx="12"/></g><g fill="#f1f5f9" font-size="17"><text x="127" y="247">Start</text><text x="342" y="230">Open form</text><text x="342" y="255">Enter details</text><text x="567" y="230">Validate</text><text x="567" y="255">fields</text><text x="792" y="230">POST API</text><text x="792" y="255">/incidents/</text><text x="1025" y="230">Save incident</text><text x="1025" y="255">Create alert</text></g><g stroke="#70b7ff" stroke-width="4" fill="none"><path d="M200 240H260"/><path d="M425 240H485"/><path d="M650 240H710"/><path d="M875 240H935"/></g><g fill="#8fb8a0" font-size="15"><text x="450" y="345">Invalid: show errors and return to form</text><text x="900" y="345">Success: show INC#### confirmation</text></g></g></svg>