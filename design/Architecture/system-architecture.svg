<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">CampusShield AI system architecture</title><desc id="desc">Browser frontend connects to Django API, database, prediction service, and Leaflet map.</desc>
<rect width="1200" height="700" fill="#07130d"/><text x="70" y="70" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="34" font-weight="700">CampusShield AI</text><text x="70" y="105" fill="#8fb8a0" font-family="Arial,sans-serif" font-size="18">Real-Time Crime Hotspot Prediction System</text>
<g font-family="Arial,sans-serif"><rect x="70" y="190" width="270" height="150" rx="12" fill="#102a1d" stroke="#006b3f" stroke-width="3"/><text x="100" y="235" fill="#fdb913" font-size="20" font-weight="700">USER BROWSER</text><text x="100" y="270" fill="#f1f5f9" font-size="18">React + Vite</text><text x="100" y="300" fill="#8fb8a0" font-size="15">Dashboard, forms, charts</text><text x="100" y="324" fill="#8fb8a0" font-size="15">and Leaflet map</text>
<rect x="465" y="190" width="270" height="150" rx="12" fill="#102a1d" stroke="#1976d2" stroke-width="3"/><text x="495" y="235" fill="#70b7ff" font-size="20" font-weight="700">DJANGO API</text><text x="495" y="270" fill="#f1f5f9" font-size="18">Accounts + Incidents</text><text x="495" y="300" fill="#8fb8a0" font-size="15">Alerts + Dashboard</text><text x="495" y="324" fill="#8fb8a0" font-size="15">Authentication + roles</text>
<rect x="860" y="130" width="270" height="140" rx="12" fill="#102a1d" stroke="#fdb913" stroke-width="3"/><text x="890" y="175" fill="#fdb913" font-size="20" font-weight="700">DATABASE</text><text x="890" y="210" fill="#f1f5f9" font-size="18">SQLite (development)</text><text x="890" y="240" fill="#8fb8a0" font-size="15">Users, incidents, alerts</text>
<rect x="860" y="350" width="270" height="150" rx="12" fill="#102a1d" stroke="#c88719" stroke-width="3"/><text x="890" y="395" fill="#fdb913" font-size="20" font-weight="700">AI SERVICE</text><text x="890" y="430" fill="#f1f5f9" font-size="18">Python + scikit-learn</text><text x="890" y="460" fill="#8fb8a0" font-size="15">Random Forest model</text><text x="890" y="484" fill="#8fb8a0" font-size="15">Risk probability + level</text>
<path d="M340 265H465M735 225H860M735 300L860 425" stroke="#70b7ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M995 270V350" stroke="#fdb913" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="365" y="250" fill="#8fb8a0" font-size="15">Axios /api</text><text x="755" y="210" fill="#8fb8a0" font-size="15">Django ORM</text><text x="755" y="350" fill="#8fb8a0" font-size="15">prediction request</text></g><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#70b7ff"/></marker></defs>
